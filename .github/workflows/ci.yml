name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the floor declared in pyproject.toml; 3.13 catches the
        # deprecations that land between releases.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e ".[dev]"

      - name: Lint
        run: python3 -m ruff check src tests examples

      - name: Test
        run: python3 -m pytest tests/ -v

      - name: Ledger integrity smoke test
        run: bash scripts/run_ci_checks.sh

  examples:
    # The examples are the documented install path. If one of them cannot run
    # in a clean container with no credentials, then the README is wrong, and
    # a README that lies about how to run the code is the failure mode this
    # project exists to prevent.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (no optional extras, no credentials)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e .

      - name: Run every example with an empty environment
        env:
          # Deliberately empty: if an example needs a key, it must say so.
          ARX_LLM_BASE_URL: ""
          ARX_LLM_API_KEY: ""
          ARX_ZOTERO_ENABLED: "0"
        run: |
          for example in examples/[0-9]*.py; do
            echo "=== $example"
            python3 "$example"
          done

  audit-example:
    # A second pass over the flagship example, checking that the audit CLI
    # works end to end on the ledger it produces.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e .

      - name: Produce a ledger and verify it through the CLI
        run: |
          python3 examples/01_quick_run.py
          LEDGER="examples/_out/01_quick_run/healthy/ledger.jsonl"
          python3 -m arx.cli verify-ledger "$LEDGER"
          python3 -m arx.cli anchor "$LEDGER"
          python3 -m arx.cli verify-ledger "$LEDGER" --anchor "$LEDGER.anchor.json"
          python3 -m arx.cli replay "$LEDGER"

      - name: Report the doctor summary
        run: python3 -m arx.cli doctor
