[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arx-researcher"
version = "0.3.0"
description = "Autonomous Researcher eXecutive: an evaluation gate that refuses to let statistically unreadable claims into a report."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "arx contributors" }]
keywords = ["reproducibility", "evaluation", "multiple-testing", "dawid-skene", "research-agent"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]
rl = ["stable-baselines3>=2.4", "gymnasium>=0.29"]
provenance = ["cryptography>=42.0"]
longterm = ["sentence-transformers>=3.0", "scikit-learn>=1.4"]

[project.scripts]
arx = "arx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arx"]

[tool.ruff]
line-length = 100
target-version = "py312"
# `examples/_out` is scratch output rewritten by every example run. Linting
# generated code is a way to make a repo fail for reasons nobody chose.
extend-exclude = ["examples/_out"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
